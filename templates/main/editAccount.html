{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ st_title }} -ChirpCakes-</title>
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <script src="https://kit.fontawesome.com/c5688669be.js" crossorigin="anonymous"></script>
    <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">

</head>

<body>
    {% include 'main/component/banner.html' %}
    <div id="root">
        <main id="edituser">
            <div class="form-body">
                <form action="{% url 'main:edituser' %}" method="post" enctype="multipart/form-data">
                    <div class="form-title">
                        <h2>
                            会員情報の変更
                        </h2>

                        <a href="{% url 'main:mypage' %}">
                            マイページへ戻る
                        </a>
                    </div>
                    {% csrf_token %}
                    {% for item in form %}
                    {% if item.name == 'mail_deriv' %}
                    <div class="form-field">
                        <div class="form-check">
                            <input type="checkbox" name="{{item.name}}" id="{{item.id_for_label}}"
                                value="{{ item.field.initial }}">
                            <div class="form-label">
                                <label for="{{item.id_for_label}}">
                                    お知らせメールの配信を希望する
                                </label>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    {% if item.errors %}
                    <div class="form-field is-error">
                        {% else %}
                        <div class="form-field">
                            {% endif %}
                            <div class="form-text">
                                <div class="form-label">
                                    <label for="{{ item.id_for_label }}" class="label has-text-left">
                                        {{ item.label }}
                                    </label>
                                </div>
                                <div class="form-label">
                                    {{ item.errors }}
                                </div>
                                <div class="form-label">

                                </div>
                                <input {% if item.name == 'birthday' %} type="date" {% else %}
                                    type="{{ item.field.widget.input_type }}" {% endif %} class="input is-normal"
                                    {% if item.field.widget.input_type == 'text' %} placeholder="{{ item.label }}"
                                    {% elif item.field.widget.input_type == 'email' %} placeholder="xxx@ooo.□□□"
                                    {% endif %} {% if item.field.required %} required {% endif %} name="{{item.name}}"
                                    id="{{item.id_for_label}}" {% if item.name == 'birthday' %}
                                    value="{{ item.field.initial|date:'Y-m-d' }}" {% else %}
                                    value="{{ item.field.initial }}" {% endif %}>
                            </div>
                        </div>
                        {% endif %}
                        {% endfor %}
                        <input type="submit" value="変更">
                </form>
            </div>
        </main>
    </div>
</body>

</html>
