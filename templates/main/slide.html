<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <div class="carousel">
            <div class="list">
                <div class="list__item">
                    <div class="item">1</div>
                </div>
                <div class="list__item">
                    <div class="item">1</div>
                </div>
                <div class="list__item">
                    <div class="item">1</div>
                </div>
                <div class="list__item">
                    <div class="item">1</div>
                </div>
                <div class="list__item">
                    <div class="item">1</div>
                </div>
            </div>
        </div>
    </div>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 10px;
            width: 500px;
            margin: 0 auto;
        }

        .carousel {
            border: solid 2px #ccc;
            overflow: hidden;
            background-color: red;
        }

        .list {
            width: 100px;
            margin: 0 auto;
            white-space: nowrap;
            font-size: 0;
            transition: transform 0.5s;
            background-color: khaki;
        }

        .list__item {
            display: inline-block;
            padding: 10px;
            width: 100%;
            height: 200px;
            font-size: 16px;
            /* background-color: saddlebrown; */
        }

        .item {
            width: 100%;
            height: 100%;
            border: solid 1px #000;
            user-select: none;
        }

        .item--copy {
            background-color: #f0f0ff;
        }
    </style>
</body>

</html>
