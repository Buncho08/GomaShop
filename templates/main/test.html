<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="cart-container">
        <div class="cart-column left-column">
            <h2>カート</h2>
            <div class="cart-items">
                <!-- 商品リスト -->
                <div class="cart-item">
                    <span class="item-name">商品名</span>
                    <span class="item-price">$価格</span>
                    <input class="item-quantity" type="number" value="1">
                    <button class="delete-item-btn">削除</button>
                </div>
                <!-- 他の商品も同様に追加 -->
            </div>
            <div class="cart-summary">
                <!-- 合計金額 -->
                <div class="total">
                    <span>合計:</span>
                    <span class="total-amount">$合計金額</span>
                </div>
                <!-- プロモーションコード入力欄 -->
                <input class="promo-code-input" type="text" placeholder="プロモーションコードを入力">
                <!-- チェックアウトボタン -->
                <button class="checkout-btn">チェックアウト</button>
            </div>
        </div>
    
        <div class="cart-column right-column">
            <h2>注文サマリー</h2>
            <div class="order-summary">
                <!-- 注文サマリーの内容 -->
                <div class="summary-item">
                    <span class="summary-name">商品名</span>
                    <span class="summary-price">$価格</span>
                    <span class="summary-quantity">x 数量</span>
                </div>
                <!-- 他の商品も同様に追加 -->
            </div>
            <!-- 送料情報、支払い情報、サポート情報、おすすめ商品を適宜追加 -->
        </div>
    </div>
</body>
</html>
